name: Feature request
description: Suggest an idea for HD Wallet
title: "[FEAT] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Check [docs/ROADMAP.md](../blob/main/docs/ROADMAP.md) before filing — your idea may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: security
    attributes:
      label: Security impact
      options:
        - label: This touches crypto, vault, signing, or worker boundaries
          required: false
